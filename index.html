<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRA TỔ BAY</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="container">

        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <header class="header">

            <div class="title">
                TRA TỔ BAY
            </div>

            <div class="subtitle">
                KIỂM TRA ĐỔI TỔ THEO CẶP CHUYẾN BAY
            </div>

        </header>


        <!-- ================================================= -->
        <!-- UPLOAD -->
        <!-- ================================================= -->

        <section class="upload-section">

            <label
                for="excelFile"
                class="upload-button"
            >
                📂 TẢI FILE CREW LIST
            </label>

            <input
                type="file"
                id="excelFile"
                accept=".xlsx,.xls"
                hidden
            >

            <span
                id="fileName"
                class="file-name"
            >
                Chưa chọn file
            </span>

        </section>


        <!-- ================================================= -->
        <!-- STATUS -->
        <!-- ================================================= -->

        <div
            id="status"
            class="status"
        >
            Vui lòng tải file Crew List.
        </div>


        <!-- ================================================= -->
        <!-- SEARCH -->
        <!-- ================================================= -->

        <section class="search-section">

            <div class="search-box">

                <label for="departureFlight">
                    TỔ BAY ĐI
                </label>

                <div class="input-wrapper">

                    <span class="prefix">
                        VJ
                    </span>

                    <input
                        type="text"
                        id="departureFlight"
                        placeholder="495"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="search-box">

                <label for="arrivalFlight">
                    TỔ BAY ĐẾN
                </label>

                <div class="input-wrapper">

                    <span class="prefix">
                        VJ
                    </span>

                    <input
                        type="text"
                        id="arrivalFlight"
                        placeholder="454"
                        autocomplete="off"
                    >

                </div>

            </div>


        </section>


        <!-- ================================================= -->
        <!-- CHECK BUTTON -->
        <!-- ================================================= -->

        <div class="check-section">

            <button
                id="checkBtn"
                class="check-button"
            >
                KIỂM TRA TỔ BAY
            </button>

        </div>


        <!-- ================================================= -->
        <!-- RESULT -->
        <!-- ================================================= -->

        <section
            id="result"
            class="result"
        >

            <div class="result-empty">

                Nhập số hiệu chuyến bay đi và chuyến bay đến
                để kiểm tra tổ bay.

            </div>

        </section>


    </div>


    <!-- ================================================= -->
    <!-- XLSX LIBRARY -->
    <!-- ================================================= -->

    <script src="xlsx.full.min.js"></script>


    <!-- ================================================= -->
    <!-- APP -->
    <!-- ================================================= -->

    <script src="app.js"></script>

</body>

</html>
