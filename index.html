<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Tra đổi tổ bay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>TRA ĐỔI TỔ BAY</h1>

    <p class="subtitle">
        Chọn dữ liệu trước khi bắt đầu
    </p>

    <div class="card">

        <label>Tệp Excel tổ bay</label>

        <input
            type="file"
            id="crewFile"
            accept=".xlsx,.xls">

    </div>

    <div class="card">

        <label>Lịch chuyến bay</label>

        <input
            type="file"
            id="flightFile"
            accept=".xlsx,.xls">

    </div>

    <button id="startBtn">
        Tiếp tục
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
