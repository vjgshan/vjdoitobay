<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>TRA TỔ BAY</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="container">


       

        <header class="header">

            <div class="title">
                TRA TỔ BAY
            </div>

            <div class="subtitle">
                KIỂM TRA ĐỔI TỔ THEO CẶP CHUYẾN BAY
            </div>

        </header>


       

        <section class="upload-section">

            <label
                for="excelFile"
                class="upload-button"
            >
                📂 TẢI FILE CREW LIST
            </label>

            <input
                type="file"
                id="excelFile"
                accept=".xlsx,.xls"
                hidden
            >

            <span
                id="fileName"
                class="file-name"
            >
                Chưa chọn file
            </span>

        </section>


   

        <div
            id="status"
            class="status"
        >
            Vui lòng tải file Crew List.
        </div>


       

        <section class="search-section">


       

            <div class="search-box">

                <label for="departureFlight">
                    TỔ BAY ĐI
                </label>


                <div class="input-wrapper">

                    <span class="prefix">
                        VJ
                    </span>


                    <input
                        type="tel"
                        id="departureFlight"
                        name="departureFlight"
                        placeholder="567"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="4"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        enterkeyhint="next"
                    >

                </div>

            </div>


          

            <div class="arrow">
                →
            </div>


           

            <div class="search-box">

                <label for="arrivalFlight">
                    TỔ BAY ĐẾN
                </label>


                <div class="input-wrapper">

                    <span class="prefix">
                        VJ
                    </span>


                    <input
                        type="tel"
                        id="arrivalFlight"
                        name="arrivalFlight"
                        placeholder="464"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="4"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        enterkeyhint="search"
                    >

                </div>

            </div>


        </section>


        

        <div class="check-section">

            <button
                id="checkBtn"
                class="check-button"
                type="button"
            >
                KIỂM TRA TỔ BAY
            </button>

        </div>


       
        <section
            id="result"
            class="result"
        >

            <div class="result-empty">

                Copyright © 2026 by Doan Tran Nam Hieu - VJGS HAN

            </div>

        </section>


    </div>


   

    <script src="xlsx.full.min.js"></script>


   

    <script src="app.js"></script>


   

    <script>


        const departureInput =
            document.getElementById(
                "departureFlight"
            );

        const arrivalInput =
            document.getElementById(
                "arrivalFlight"
            );


        function onlyNumbers(input) {

            input.addEventListener(
                "input",
                function () {

                    this.value =
                        this.value.replace(
                            /[^0-9]/g,
                            ""
                        );

                }
            );

        }


        onlyNumbers(
            departureInput
        );

        onlyNumbers(
            arrivalInput
        );


        

        departureInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    arrivalInput.focus();

                }

            }
        );


        

        arrivalInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    document
                        .getElementById(
                            "checkBtn"
                        )
                        .click();

                }

            }
        );

    </script>

</body>

</html>
