<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Chuyến Của Tổ Bay</title>

    <link rel="stylesheet" href="style.css">

    <!-- SheetJS -->
    <script src="xlsx.full.min.js"></script>
</head>

<body>

<div class="container">

    <h1>TRA CHUYẾN CỦA TỔ BAY</h1>

    <div class="upload-box">
        <label class="upload-btn">
            📂 Chọn Crew List
            <input type="file" id="excelFile" accept=".xlsx,.xls" hidden>
        </label>

        <span id="fileName">
            Chưa chọn file
        </span>
    </div>

    <div class="search-box">

        <input
            type="text"
            id="flightInput"
            placeholder="Nhập số hiệu chuyến (VD: 915)"
            autocomplete="off"
        >

        <button id="searchBtn">
            🔍 Tra cứu
        </button>

    </div>

    <div id="status" class="status">
        Chưa tải dữ liệu.
    </div>

    <div id="result" class="result">

        <!-- Kết quả sẽ sinh tại đây -->

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
